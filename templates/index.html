<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyAuth - Painel de Controle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 10px;
        }

        .menu a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .menu a:hover,
        .menu a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .logout-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .main {
            margin-left: 250px;
            padding: 30px;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            color: #333;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .btn-success {
            background: #51cf66;
            color: white;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .keys-table {
            width: 100%;
            border-collapse: collapse;
        }

        .keys-table thead {
            background: #f5f7fa;
        }

        .keys-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #ddd;
        }

        .keys-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .keys-table tbody tr:hover {
            background: #f9f9f9;
        }

        .key-string {
            font-family: 'Courier New', monospace;
            background: #f5f7fa;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .status-expired {
            background: #e2e3e5;
            color: #383d41;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin-bottom: 5px;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .copy-btn {
            padding: 2px 6px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }

            .main {
                margin-left: 200px;
                padding: 15px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .keys-table {
                font-size: 12px;
            }

            .keys-table th,
            .keys-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🔐 KeyAuth</div>
        <ul class="menu">
            <li><a href="#dashboard" onclick="showTab('dashboard')" class="menu-link active">📊 Dashboard</a></li>
            <li><a href="#keys" onclick="showTab('keys')" class="menu-link">🔑 Chaves</a></li>
            <li><a href="#create" onclick="showTab('create')" class="menu-link">➕ Nova Chave</a></li>
        </ul>
        <a href="/logout" class="logout-btn">Sair</a>
    </div>

    <div class="main">
        <div class="header">
            <h1 id="page-title">Dashboard</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showTab('create')">+ Nova Chave</button>
            </div>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard-tab" class="tab-content">
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="stat-value" id="total-keys">-</div>
                    <div class="stat-label">Chaves Criadas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="total-validations">-</div>
                    <div class="stat-label">Total de Validações</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="active-keys">-</div>
                    <div class="stat-label">Chaves Ativas</div>
                </div>
            </div>

            <div class="section">
                <h2>Informações da API</h2>
                <div class="form-group">
                    <label>Endpoint de Validação</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" value="POST /api/validate" readonly style="flex: 1;">
                        <button class="btn btn-secondary btn-small" onclick="copyToClipboard('POST /api/validate')">Copiar</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Endpoint de Informação</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" value="GET /api/key-info/{key_string}" readonly style="flex: 1;">
                        <button class="btn btn-secondary btn-small" onclick="copyToClipboard('GET /api/key-info/{key_string}')">Copiar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Keys Tab -->
        <div id="keys-tab" class="tab-content" style="display: none;">
            <div class="section">
                <h2>Minhas Chaves</h2>
                <div id="keys-list" class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Create Key Tab -->
        <div id="create-tab" class="tab-content" style="display: none;">
            <div class="section">
                <h2>Criar Nova Chave</h2>
                <form id="create-form">
                    <div class="form-group">
                        <label for="key-name">Nome da Chave *</label>
                        <input type="text" id="key-name" required placeholder="Ex: My Script v1.0">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="expires-in">Expiração (dias)</label>
                            <input type="number" id="expires-in" placeholder="Deixe em branco para nunca expirar" min="0">
                        </div>

                        <div class="form-group">
                            <label for="max-uses">Limite de Usos</label>
                            <input type="number" id="max-uses" placeholder="Deixe em branco para ilimitado" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="device-lock">Device Lock (opcional)</label>
                        <input type="text" id="device-lock" placeholder="Ex: computador_123 (deixe vazio para qualquer dispositivo)">
                    </div>

                    <div id="create-message"></div>

                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">Criar Chave</button>
                    </div>
                </form>
            </div>

            <div class="section" id="created-key" style="display: none;">
                <h2>✅ Chave Criada com Sucesso!</h2>
                <div class="alert alert-success">Copie a chave abaixo. Você não poderá vê-la novamente!</div>
                <div class="form-group">
                    <label>Chave:</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="new-key-string" readonly class="key-string" style="flex: 1;">
                        <button type="button" class="btn btn-primary btn-small" onclick="copyNewKey()">Copiar</button>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="resetCreateForm()">Criar Outra Chave</button>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'dashboard';

        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => {
                el.style.display = 'none';
            });

            // Remove active class from menu links
            document.querySelectorAll('.menu-link').forEach(el => {
                el.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName + '-tab').style.display = 'block';
            event.target.classList.add('active');

            currentTab = tabName;

            // Update page title
            const titles = {
                'dashboard': 'Dashboard',
                'keys': 'Minhas Chaves',
                'create': 'Nova Chave'
            };
            document.getElementById('page-title').textContent = titles[tabName];

            // Load data if needed
            if (tabName === 'keys') {
                loadKeys();
            } else if (tabName === 'dashboard') {
                loadStats();
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/keys');
                const keys = await response.json();

                let total = keys.length;
                let active = keys.filter(k => k.is_active && (!k.expires_at || new Date(k.expires_at) > new Date())).length;
                let validations = keys.reduce((sum, k) => sum + k.uses, 0);

                document.getElementById('total-keys').textContent = total;
                document.getElementById('active-keys').textContent = active;
                document.getElementById('total-validations').textContent = validations;
            } catch (error) {
                console.error('Erro ao carregar estatísticas:', error);
            }
        }

        async function loadKeys() {
            try {
                const response = await fetch('/api/keys');
                const keys = await response.json();

                let html = '';

                if (keys.length === 0) {
                    html = '<p style="text-align: center; color: #999;">Nenhuma chave criada ainda</p>';
                } else {
                    html = `
                        <table class="keys-table">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Chave</th>
                                    <th>Status</th>
                                    <th>Usos</th>
                                    <th>Última Utilização</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    keys.forEach(key => {
                        let status = 'Ativa';
                        let statusClass = 'status-active';

                        if (!key.is_active) {
                            status = 'Desativada';
                            statusClass = 'status-inactive';
                        } else if (key.expires_at && new Date(key.expires_at) < new Date()) {
                            status = 'Expirada';
                            statusClass = 'status-expired';
                        }

                        const lastUsed = key.last_used ? new Date(key.last_used).toLocaleDateString('pt-BR') : '-';
                        const uses = key.max_uses ? `${key.uses}/${key.max_uses}` : `${key.uses}`;

                        html += `
                            <tr>
                                <td>${key.name}</td>
                                <td>
                                    <span class="key-string">${key.key_string.substring(0, 15)}...</span>
                                    <button class="copy-btn" onclick="copyKey('${key.key_string}')">Copiar</button>
                                </td>
                                <td><span class="status ${statusClass}">${status}</span></td>
                                <td>${uses}</td>
                                <td>${lastUsed}</td>
                                <td class="actions">
                                    <button class="btn btn-secondary btn-small" onclick="toggleKey(${key.id}, ${key.is_active})">${key.is_active ? 'Desativar' : 'Ativar'}</button>
                                    <button class="btn btn-danger btn-small" onclick="deleteKey(${key.id})">Deletar</button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `
                            </tbody>
                        </table>
                    `;
                }

                document.getElementById('keys-list').innerHTML = html;
            } catch (error) {
                document.getElementById('keys-list').innerHTML = `<div class="alert alert-error">Erro ao carregar chaves</div>`;
            }
        }

        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('key-name').value;
            const expiresIn = document.getElementById('expires-in').value;
            const maxUses = document.getElementById('max-uses').value;
            const deviceLock = document.getElementById('device-lock').value;

            try {
                const response = await fetch('/api/keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        expires_in_days: expiresIn ? parseInt(expiresIn) : null,
                        max_uses: maxUses ? parseInt(maxUses) : null,
                        device_lock: deviceLock || null
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('new-key-string').value = data.key_string;
                    document.getElementById('create-form').style.display = 'none';
                    document.getElementById('created-key').style.display = 'block';
                } else {
                    showCreateMessage(data.error, 'error');
                }
            } catch (error) {
                showCreateMessage('Erro ao criar chave', 'error');
            }
        });

        function showCreateMessage(msg, type) {
            const el = document.getElementById('create-message');
            el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
        }

        function resetCreateForm() {
            document.getElementById('create-form').style.display = 'block';
            document.getElementById('created-key').style.display = 'none';
            document.getElementById('create-form').reset();
            document.getElementById('create-message').innerHTML = '';
        }

        async function deleteKey(id) {
            if (!confirm('Tem certeza que deseja deletar esta chave?')) return;

            try {
                const response = await fetch(`/api/keys/${id}`, { method: 'DELETE' });

                if (response.ok) {
                    loadKeys();
                    loadStats();
                } else {
                    alert('Erro ao deletar chave');
                }
            } catch (error) {
                alert('Erro ao deletar chave');
            }
        }

        async function toggleKey(id, currentStatus) {
            try {
                const response = await fetch(`/api/keys/${id}/toggle`, { method: 'POST' });

                if (response.ok) {
                    loadKeys();
                } else {
                    alert('Erro ao alterar status da chave');
                }
            } catch (error) {
                alert('Erro ao alterar status da chave');
            }
        }

        function copyKey(key) {
            navigator.clipboard.writeText(key);
            alert('Chave copiada!');
        }

        function copyNewKey() {
            const key = document.getElementById('new-key-string').value;
            navigator.clipboard.writeText(key);
            alert('Chave copiada!');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('Copiado!');
        }

        // Load initial data
        loadStats();
    </script>
</body>
</html>
